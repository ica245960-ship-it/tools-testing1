services:
  - type: web
    name: hermes-gemini-telegram
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ADMIN_TOKEN
        sync: false
      - key: SQL_DSN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-pro
      - key: TELEGRAM_WEBHOOK_PORT
        value: "8443"
      - key: HERMES_GATEWAY_BOOTSTRAP_STATE
        value: running
